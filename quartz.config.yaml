# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Vince Honrado Imbat"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: umami
    websiteId: "5fef3b82-741b-4632-88a1-89d33fa746e8"
  locale: en-US
  baseUrl: vinceimbat.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - 00 inbox
    - 01 daily notes
    - 02 projects
    - 03 areas
    - 04 notes
    - 05 essays
    - 06 newsletters
    - 07 obsidian/templates
    - literature source
    - readwise
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Fraunces
      body: Onest
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#fffcf0"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "./quartz/plugins/local/explicit-tags-only"
    enabled: true
    order: 6
  - source: "./quartz/plugins/local/sidenotes"
    enabled: true
    order: 15
  - source: "./quartz/plugins/local/lightbox"
    enabled: true
    order: 100
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "./quartz/plugins/local/image-captions"
    enabled: true
    order: 35
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: false
    order: 50
    layout:
      position: right
      priority: 30
      condition: not-index
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      openLinksInNewTab: true
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: true
    options:
      # ./bibliography.bib is a symlink to the real Zotero auto-export (see
      # the "Keep updated" auto-export set up in Zotero) — this indirection
      # exists because the plugin does path.join(cwd, bibliographyFile)
      # unconditionally, which mangles an absolute path instead of using it
      # as-is, so the export's real location can't be referenced directly.
      bibliographyFile: "./bibliography.bib"
      linkCitations: true
      csl: mla
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "./quartz/plugins/local/disable-homepage-popovers"
    enabled: true
    order: 95
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: googleFonts

      title:
        name: Space Grotesk
        weights: [500, 700]
        includeItalic: true

      header:
        name: Fraunces
        weights: [400, 500, 600, 700, 900]
        includeItalic: true

      body:
        name: Onest
        weights: [400, 500, 600, 700]
        includeItalic: true

      code:
        name: IBM Plex Mono
        weights: [400]

  - source: "@quartz-community/remove-draft"
    enabled: false
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      # Not `condition: not-index` anymore — that excluded the component
      # from the homepage's layout entirely, not just visually, so its
      # Cmd/Ctrl+K listener (bound globally to `document` by the
      # component's own script) never mounted there. The homepage's
      # existing `.sidebar.left { display: none }` rule in custom.scss
      # already hides the icon there regardless, so this only changes
      # whether the shortcut works — not where the icon is visible.
      display: mobile-only
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: afterBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: false
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "./quartz/plugins/local/content-meta-en"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "./quartz/plugins/local/list-search-bar"
    enabled: true
    layout:
      position: beforeBody
      priority: 40
  # Disabled for now (not deleted) — list pages fall back to the plain
  # centered column automatically once this has no output in .sidebar.right.
  - source: "./quartz/plugins/local/tag-mosaic"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: left
      priority: 10
      condition: not-index
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
      condition: not-index
      display: mobile-only
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
      condition: not-index
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
    options:
      spacerSymbol: "/"
      rootName: "~"
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Instagram: https://www.instagram.com/vinceimbat/
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
      condition: not-index
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
      condition: not-index
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: false
    options:
      theme: default
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      exclude:
        - tag-mosaic
        - list-search-bar
    folder:
      exclude:
        - reader-mode
        - backlinks
        - content-meta-en
    tag:
      exclude:
        - reader-mode
        - backlinks
        - content-meta-en
    canvas:
      exclude:
        - tag-mosaic
        - list-search-bar
    bases:
      exclude:
        - tag-mosaic
        - list-search-bar
